[package]
name = "swarm"
version = "0.0.32"
edition = "2024"
license = "MIT"
description = "Message bus and pane control for a tree of agent CLIs"
repository = "https://github.com/PriyanshuUpadhyay/swarm"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps ~/.claude.json and the AGY settings in their own key order on a trust write.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
toml_edit = "0.25.15"
uuid = { version = "1", features = ["v7"] }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "tokio", "json", "query", "ws"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "sync", "time", "macros", "process", "io-util", "fs"] }
tokio-stream = { version = "0.1", optional = true, features = ["sync"] }
portable-pty = { version = "0.9.0", optional = true }
libc = { version = "0.2.186", optional = true }

[features]
# `swarm serve`, the local HTTP server for the web UI. Off by default, so hook calls keep a small CLI.
serve = ["dep:axum", "dep:tokio", "dep:tokio-stream", "dep:portable-pty", "dep:libc"]
