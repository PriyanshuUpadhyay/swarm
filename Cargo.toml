[package]
name = "swarm"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Message bus and pane control for a tree of agent CLIs"
repository = "https://github.com/PriyanshuUpadhyay/swarm"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps ~/.claude.json and the AGY settings in their own key order on a trust write.
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v7"] }
