# tmux adapter (default). The binary ships it; a disk file can override named verbs.
# swarm exports each var as SWARM_<KEY>; quote them so text stays data.
# The orchestrator must run inside tmux so $TMUX_PANE names the pane to split.
self = printf '%s' "$TMUX_PANE"
spawn = tmux split-window -d -h -P -F '#{pane_id}' -t "$TMUX_PANE" -c "$PWD" -e SWARM_SESSION_ID="$SWARM_SESSION_ID" -e SWARM_AGENT_ID="$SWARM_AGENT_ID" -e SWARM_HOME="$SWARM_HOME" -e SWARM_ADAPTER="$SWARM_ADAPTER"
ring = tmux send-keys -t "$SWARM_PANE" -l "$SWARM_TEXT" && sleep 0.5 && tmux send-keys -t "$SWARM_PANE" Enter
list = tmux list-panes -a -F '#{pane_id} #{pane_current_command}'
close = tmux kill-pane -t "$SWARM_PANE"
capture = tmux capture-pane -p -J -S - -t "$SWARM_PANE"
interrupt = tmux send-keys -t "$SWARM_PANE" Escape
