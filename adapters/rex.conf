# Rex adapter. Picked in a Rex block (REX_BLOCK set and TERM_PROGRAM=rex) outside Herdr and Superset, or with SWARM_ADAPTER=rex.
# swarm exports each var as SWARM_<KEY>; quote them so text stays data.
self = printf '%s' "$REX_BLOCK"
# The first child splits right of the chair; later children stack below the last child of this
# swarm session. `SWARM_PANES` holds this session's seat blocks, so another chair's seats on the
# same server are never an anchor.
# `rex split` has no env flag, so the child shell gets the swarm vars through `env`.
spawn = last=$(rex block ls --json | jq -r --arg panes " $SWARM_PANES " '[.blocks[] | select(.block_id as $id | $panes | contains(" " + $id + " "))] | last | .block_id // empty'); if [ -n "$last" ]; then anchor=$last dir=below; else anchor=$REX_BLOCK dir=right; fi; rex split -b "$anchor" --split "$dir" --focus=false --json -c "$PWD" --label "swarm-$SWARM_AGENT_ID" -- env SWARM_SESSION_ID="$SWARM_SESSION_ID" SWARM_AGENT_ID="$SWARM_AGENT_ID" SWARM_HOME="$SWARM_HOME" SWARM_ADAPTER="$SWARM_ADAPTER" "${SHELL:-/bin/zsh}" -l | jq -er '.block_ids[0]'
# A seat with a launch line runs it as the block's program, through a login and interactive
# shell so the owner's env and functions stay. `--keep-open` keeps the block, with its exit,
# after the agent and `swarm exited` end, and the dead block takes no typed input.
run = last=$(rex block ls --json | jq -r --arg panes " $SWARM_PANES " '[.blocks[] | select(.block_id as $id | $panes | contains(" " + $id + " "))] | last | .block_id // empty'); if [ -n "$last" ]; then anchor=$last dir=below; else anchor=$REX_BLOCK dir=right; fi; rex split -b "$anchor" --split "$dir" --focus=false --keep-open --json -c "$PWD" --label "swarm-$SWARM_AGENT_ID" -- env SWARM_SESSION_ID="$SWARM_SESSION_ID" SWARM_AGENT_ID="$SWARM_AGENT_ID" SWARM_HOME="$SWARM_HOME" SWARM_ADAPTER="$SWARM_ADAPTER" "${SHELL:-/bin/zsh}" -lic "$SWARM_COMMAND" | jq -er '.block_ids[0]'
ring = rex send -b "$SWARM_PANE" "$SWARM_TEXT" && sleep 0.5 && rex send-key -b "$SWARM_PANE" enter
# A seat block whose program has ended stays open; it counts as gone. Labels come from each
# session's JSON. A failed session or block listing fails the verb, so swarm never reads it as no
# panes; a failed `process` read keeps that block listed. Only `swarm-` blocks are read, about
# 20 ms each.
list = sessions=$(rex session ls --json | jq -er '.sessions[].session_id') || exit 1; rows=$(for s in $sessions; do out=$(rex block ls -s "$s" --json) || exit 1; printf '%s' "$out" | jq -r '.blocks[] | "\(.block_id) \(.label)"' || exit 1; done) || exit 1; printf '%s\n' "$rows" | while read -r id label; do [ -n "$id" ] || continue; case "$label" in swarm-*) rex block call -b "$id" process | jq -e '.child == null and .last_exit != null' >/dev/null && continue;; esac; printf '%s\n' "$id"; done
close = rex block close "$SWARM_PANE"
capture = rex capture -b "$SWARM_PANE" --unwrap --trim
screen = rex capture -b "$SWARM_PANE" --trim
focus = rex focus "$SWARM_PANE"
interrupt = rex send-key -b "$SWARM_PANE" escape
# swarm passes key names such as Enter, Down, or 2; Rex key syntax is lowercase.
key = rex send-key -b "$SWARM_PANE" "$(printf '%s' "$SWARM_KEY" | tr '[:upper:]' '[:lower:]')"
# The Rex GUI's pid, so `focus` can bring the app forward.
client = pgrep -x Rex | head -1
# The agent's own program-status record (Program Status Protocol 0.4), read by Rex from the
# agent's OSC 7501 reports: the root record, the one with no `id`, as one report body, with its
# `updated_at` as `at=<unix seconds>`. No record prints nothing.
status = rex block call -b "$SWARM_PANE" program_status | jq -r '[.records[] | select(.id == null)] | first // empty | (.updated_at | capture("^(?<t>[0-9-]+T[0-9:]+)(\\.[0-9]+)?(?<z>Z|(?<s>[+-])(?<h>[0-9]{2}):(?<m>[0-9]{2}))$")) as $c | "state=\(.state)" + (if .kind then ":kind=\(.kind)" else "" end) + (if .msg then ":msg=\(.msg | @base64)" else "" end) + ":at=\(($c.t + "Z" | fromdateiso8601) - (if $c.z == "Z" then 0 else ($c.s + "1" | tonumber) * (($c.h | tonumber) * 3600 + ($c.m | tonumber) * 60) end))"'
