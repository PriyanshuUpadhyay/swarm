# Rex adapter. Picked in a Rex block (REX_BLOCK set and TERM_PROGRAM=rex) outside Herdr and Superset, or with SWARM_ADAPTER=rex.
# swarm exports each var as SWARM_<KEY>; quote them so text stays data.
self = printf '%s' "$REX_BLOCK"
# The first child splits right of the chair; later children stack below the last child of this
# swarm session. `SWARM_PANES` holds this session's seat blocks, so another chair's seats on the
# same server are never an anchor.
# `rex split` has no env flag, so the child shell gets the swarm vars through `env`.
spawn = last=$(rex block ls --json | jq -r --arg panes " $SWARM_PANES " '[.blocks[] | select(.block_id as $id | $panes | contains(" " + $id + " "))] | last | .block_id // empty'); if [ -n "$last" ]; then anchor=$last dir=below; else anchor=$REX_BLOCK dir=right; fi; rex split -b "$anchor" --split "$dir" --focus=false --json -c "$PWD" --label "swarm-$SWARM_AGENT_ID" -- env SWARM_SESSION_ID="$SWARM_SESSION_ID" SWARM_AGENT_ID="$SWARM_AGENT_ID" SWARM_HOME="$SWARM_HOME" SWARM_ADAPTER="$SWARM_ADAPTER" "${SHELL:-/bin/zsh}" -l | jq -er '.block_ids[0]'
ring = rex send -b "$SWARM_PANE" "$SWARM_TEXT" && sleep 0.5 && rex send-key -b "$SWARM_PANE" enter
list = rex block ls -A -q --short=false
close = rex block close "$SWARM_PANE"
capture = rex capture -b "$SWARM_PANE" --unwrap --trim
screen = rex capture -b "$SWARM_PANE" --trim
focus = rex focus "$SWARM_PANE"
interrupt = rex send-key -b "$SWARM_PANE" escape
# swarm passes key names such as Enter, Down, or 2; Rex key syntax is lowercase.
key = rex send-key -b "$SWARM_PANE" "$(printf '%s' "$SWARM_KEY" | tr '[:upper:]' '[:lower:]')"
# The Rex GUI's pid, so `focus` can bring the app forward.
client = pgrep -x Rex | head -1
