# Herdr adapter. swarm init installs it at $SWARM_HOME/.swarm/adapters/herdr.conf; select with SWARM_ADAPTER=herdr.
# swarm exports each var as SWARM_<KEY>; quote them so text stays data.
self = printf '%s' "$HERDR_PANE_ID"
# Children land in the main-grid shape at spawn time (orchestrator left, children stacked
# right). Herdr refuses a pane move inside one tab, so a layout rebuilt afterwards has to
# park panes in a scratch tab, and that tab blinks in the tab bar.
spawn = python3 "$HOME"/.config/herdr/bin/swarm-split.py
ring = herdr pane send-text "$SWARM_PANE" "$SWARM_TEXT" && sleep 0.5 && herdr pane send-keys "$SWARM_PANE" Enter
list = herdr pane list
close = herdr pane close "$SWARM_PANE"
capture = herdr pane read "$SWARM_PANE"
interrupt = herdr pane send-keys "$SWARM_PANE" esc
