# Herdr adapter. swarm init installs it at $SWARM_HOME/.swarm/adapters/herdr.conf; select with SWARM_ADAPTER=herdr.
# swarm exports each var as SWARM_<KEY>; quote them so text stays data.
spawn = herdr pane split "$HERDR_PANE_ID" --direction right --no-focus --env SWARM_SESSION_ID="$SWARM_SESSION_ID" --env SWARM_AGENT_ID="$SWARM_AGENT_ID" | jq -r .result.pane.pane_id
ring = herdr pane run "$SWARM_PANE" "$SWARM_TEXT"
list = herdr pane list
close = herdr pane close "$SWARM_PANE"
capture = herdr pane read "$SWARM_PANE"
