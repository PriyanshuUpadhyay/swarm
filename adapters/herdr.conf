# Herdr adapter. Copy to $SWARM_HOME/.swarm/adapters/herdr.conf.
# swarm exports each var as SWARM_<KEY>; quote them so text stays data.
spawn = herdr pane split "$SWARM_PANE" --direction right --no-focus --env SWARM_SESSION_ID="$SWARM_SESSION_ID" --env SWARM_AGENT_ID="$SWARM_AGENT_ID"
ring = herdr pane send-text "$SWARM_PANE" "$SWARM_TEXT"
list = herdr pane list
close = herdr pane close "$SWARM_PANE"
