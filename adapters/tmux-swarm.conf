# Detached tmux adapter for one attachable agent pane per session.
# swarm exports each var as SWARM_<KEY>; quote them so text stays data.
# The pane's raw output goes to $SWARM_FEED, a quoted `swarm status-feed` line that stores the
# agent's OSC 7501 reports.
self = printf '%s' "$TMUX_PANE"
spawn = tmux -L swarm -f /dev/null new-session -d -P -F '#{pane_id}' -s "swarm_${SWARM_SESSION_ID}_${SWARM_AGENT_ID}" -c "$PWD" -e SWARM_SESSION_ID="$SWARM_SESSION_ID" -e SWARM_AGENT_ID="$SWARM_AGENT_ID" -e SWARM_HOME="$SWARM_HOME" -e SWARM_ADAPTER="$SWARM_ADAPTER" \; set-option -t "swarm_${SWARM_SESSION_ID}_${SWARM_AGENT_ID}" status off \; set-option -t "swarm_${SWARM_SESSION_ID}_${SWARM_AGENT_ID}" prefix None \; pipe-pane -O -t "swarm_${SWARM_SESSION_ID}_${SWARM_AGENT_ID}" "$SWARM_FEED"
ring = tmux -L swarm send-keys -t "$SWARM_PANE" -l "$SWARM_TEXT" && sleep 0.5 && tmux -L swarm send-keys -t "$SWARM_PANE" Enter
list = out=$(tmux -L swarm list-panes -a -F '#{pane_id} #{pane_current_command} activity=#{window_activity}' 2>&1) && printf '%s\n' "$out" || case "$out" in *'no server running'*|*'error connecting'*) : ;; *) printf '%s\n' "$out" >&2; exit 1 ;; esac
close = session=$(tmux -L swarm display-message -p -t "$SWARM_PANE" '#{session_name}') || exit $?; test -n "$session" || { printf 'no session for %s\n' "$SWARM_PANE" >&2; exit 1; }; tmux -L swarm kill-session -t "=$session"
capture = tmux -L swarm capture-pane -p -J -S - -t "$SWARM_PANE"
# tmux keeps a window at its last client's size, and `screen` reads the pane at that size, so the
# first viewer saves the size in the window option @swarm_size and the last one out puts it back.
# A saved size that is still there (its viewer was killed) is the original, so it is kept.
# The shell ignores the hangup that ends the client, so the restore still runs when the viewer's
# terminal closes.
attach = session=$(tmux -L swarm display-message -p -t "$SWARM_PANE" '#{session_name}') || exit $?; test -n "$session" || { printf 'no session for %s\n' "$SWARM_PANE" >&2; exit 1; }; test "$(tmux -L swarm display-message -p -t "$SWARM_PANE" '#{session_attached}')" = 0 && test -z "$(tmux -L swarm show-options -wqv -t "$SWARM_PANE" @swarm_size)" && tmux -L swarm set-option -w -t "$SWARM_PANE" @swarm_size "$(tmux -L swarm display-message -p -t "$SWARM_PANE" '#{window_width} #{window_height}')"; trap '' HUP; tmux -L swarm attach-session -t "=$session"; status=$?; test "$(tmux -L swarm display-message -p -t "$SWARM_PANE" '#{session_attached}')" = 0 && size=$(tmux -L swarm show-options -wqv -t "$SWARM_PANE" @swarm_size) && test -n "$size" && tmux -L swarm resize-window -t "$SWARM_PANE" -x "${size% *}" -y "${size#* }" \; set-option -w -u -t "$SWARM_PANE" window-size \; set-option -w -u -t "$SWARM_PANE" @swarm_size; exit $status
# No focus: this server is detached, so attach opens the pane.
interrupt = tmux -L swarm send-keys -t "$SWARM_PANE" Escape
screen = tmux -L swarm capture-pane -p -t "$SWARM_PANE"
# One key name, not text: `swarm answer` sends a digit, Up, Down, or Enter.
key = tmux -L swarm send-keys -t "$SWARM_PANE" "$SWARM_KEY"
