# Detached tmux adapter for one attachable agent pane per session.
# swarm exports each var as SWARM_<KEY>; quote them so text stays data.
self = printf '%s' "$TMUX_PANE"
spawn = tmux -L swarm -f /dev/null new-session -d -P -F '#{pane_id}' -s "swarm_${SWARM_SESSION_ID}_${SWARM_AGENT_ID}" -c "$PWD" -e SWARM_SESSION_ID="$SWARM_SESSION_ID" -e SWARM_AGENT_ID="$SWARM_AGENT_ID" -e SWARM_HOME="$SWARM_HOME" -e SWARM_ADAPTER="$SWARM_ADAPTER" \; set-option -t "swarm_${SWARM_SESSION_ID}_${SWARM_AGENT_ID}" status off \; set-option -t "swarm_${SWARM_SESSION_ID}_${SWARM_AGENT_ID}" prefix None
ring = tmux -L swarm send-keys -t "$SWARM_PANE" -l "$SWARM_TEXT" && sleep 0.5 && tmux -L swarm send-keys -t "$SWARM_PANE" Enter
list = out=$(tmux -L swarm list-panes -a -F '#{pane_id} #{pane_current_command}' 2>&1) && printf '%s\n' "$out" || case "$out" in *'no server running'*) : ;; *) printf '%s\n' "$out" >&2; exit 1 ;; esac
close = session=$(tmux -L swarm display-message -p -t "$SWARM_PANE" '#{session_name}') || exit $?; test -n "$session" || { printf 'no session for %s\n' "$SWARM_PANE" >&2; exit 1; }; tmux -L swarm kill-session -t "=$session"
capture = tmux -L swarm capture-pane -p -J -S - -t "$SWARM_PANE"
attach = session=$(tmux -L swarm display-message -p -t "$SWARM_PANE" '#{session_name}') || exit $?; test -n "$session" || { printf 'no session for %s\n' "$SWARM_PANE" >&2; exit 1; }; tmux -L swarm attach-session -t "=$session"
interrupt = tmux -L swarm send-keys -t "$SWARM_PANE" Escape
screen = tmux -L swarm capture-pane -p -t "$SWARM_PANE"
# One key name, not text: `swarm answer` sends a digit, Up, Down, or Enter.
key = tmux -L swarm send-keys -t "$SWARM_PANE" "$SWARM_KEY"
# One notice for the owner (ADR 0045). The text goes to osascript as argv, never as AppleScript.
notify = osascript -e 'on run argv' -e 'display notification (item 2 of argv) with title (item 1 of argv) sound name "Glass"' -e 'end run' "$SWARM_TITLE" "$SWARM_BODY"
