# Superset adapter. Picked in a Superset terminal (SUPERSET_TERMINAL_ID set) outside Herdr, or with SWARM_ADAPTER=superset.
# swarm exports each var as SWARM_<KEY>; quote them so text stays data.
self = printf '%s' "$SUPERSET_TERMINAL_ID"
# `terminals create` takes no env, so the child shell gets the swarm vars from one export line.
spawn = id=$(superset terminals create --workspace "$SUPERSET_WORKSPACE_ID" --cwd "$PWD" --json | jq -r .terminalId) && test -n "$id" && superset terminals send --workspace "$SUPERSET_WORKSPACE_ID" --terminal "$id" --text "export SWARM_SESSION_ID='$SWARM_SESSION_ID' SWARM_AGENT_ID='$SWARM_AGENT_ID' SWARM_HOME='$SWARM_HOME' SWARM_ADAPTER='$SWARM_ADAPTER'" >/dev/null && printf '%s' "$id"
ring = superset terminals send --workspace "$SUPERSET_WORKSPACE_ID" --terminal "$SWARM_PANE" --text "$SWARM_TEXT"
# The TerminalSession id field name is not verified against a running CLI, so name both.
list = superset terminals list --workspace "$SUPERSET_WORKSPACE_ID" --json | jq -r '.sessions[] | .terminalId // .id'
close = superset terminals close --workspace "$SUPERSET_WORKSPACE_ID" --terminal "$SWARM_PANE"
# `terminals read` returns the current screen, not the scrollback.
capture = superset terminals read --workspace "$SUPERSET_WORKSPACE_ID" --terminal "$SWARM_PANE" --json | jq -r .text
screen = superset terminals read --workspace "$SUPERSET_WORKSPACE_ID" --terminal "$SWARM_PANE" --max-lines 40 --json | jq -r .text
# No key, interrupt, or attach: `terminals send` wraps text in bracketed paste and strips control
# bytes, so no verb can press Escape, Up, Down, or Enter alone. `swarm answer` and
# `swarm interrupt` then fail with swarm's own "has no key" error.
