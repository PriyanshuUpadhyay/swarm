name: ci

# The required checks: scripts/release.sh releases only a commit whose ci run passed. Slow or
# timing-sensitive checks run in background.yml and do not gate a release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The row tests run the transcript tool from packages/transcript/zig-out.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - run: zig build -Doptimize=ReleaseSafe
        working-directory: packages/transcript
      # Tag runs read the cache that main saves, so a release compiles only the changed crates.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: python3 -I scripts/test_stamp_kit.py

  zig:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/transcript
    steps:
      - uses: actions/checkout@v4
      # Zig asks CI not to download from ziglang.org; this action uses the signed community mirrors.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - run: zig fmt --check .
      - run: zig build test

  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # PRIVATE_PATTERNS is the owner's private word list; without it only the public rules run.
      - run: scripts/public-safety.sh
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
