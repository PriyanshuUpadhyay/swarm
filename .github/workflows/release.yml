name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# scripts/release.sh tags only a commit whose ci run passed, and the release commit changes only
# the version, so this workflow does not run the checks again.
jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare source archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "tag $RELEASE_TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
          mkdir dist
          git archive --format=tar.gz --prefix="swarm-$version/" --output="dist/swarm-$version.tar.gz" HEAD
          (cd dist && sha256sum "swarm-$version.tar.gz" > "swarm-$version.sha256")
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 --verify-tag --draft --generate-notes

  package:
    needs: source
    # The notice helper targets macOS 26, so it needs that SDK and Swift 6.2.
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # swarm embeds web/dist (ADR 0079); build.sh builds it with pnpm.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@11.15.1
      # build.sh signs with swarm-local when the keychain has it, so released apps keep their
      # privacy answers across updates. A release without it would quietly sign ad hoc, so fail.
      - name: Import the swarm-local signing identity
        env:
          SWARM_SIGNING_P12: ${{ secrets.SWARM_SIGNING_P12 }}
          SWARM_SIGNING_PASSWORD: ${{ secrets.SWARM_SIGNING_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$SWARM_SIGNING_P12" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$SWARM_SIGNING_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # one keychain path per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning | grep -q '"swarm-local"' \
            || { echo 'no swarm-local identity after the import' >&2; exit 1; }
      # Only this build uses ~/.swarm; any other build keeps a branch home (ADR 0027).
      - run: make -C ui package
        env:
          SWARM_RELEASE_BUILD: '1'
      - name: Attach the tarball to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" ui/.build/release/swarm-*-macos-arm64.tar.gz
