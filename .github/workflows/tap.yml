name: Tap

# Points the Homebrew tap at a release once the owner publishes the draft, so the tarball is public.
# swarm ships as one formula: the CLI with the web UI inside, plus the transcript tool, the notice
# helper and the skills in libexec (ADR 0079). The same tap commit deletes the old swarm-app cask.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tap:
    runs-on: ubuntu-latest
    steps:
      - name: Update the swarm formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          version="${RELEASE_TAG#v}"
          tarball="swarm-$version-macos-arm64.tar.gz"
          gh release download "$RELEASE_TAG" -R "${{ github.repository }}" -p "$tarball"
          sha=$(sha256sum "$tarball" | cut -d' ' -f1)

          install -m 600 /dev/null ~/tap_key
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/tap_key -o IdentitiesOnly=yes"
          git clone -q git@github.com:PriyanshuUpadhyay/homebrew-tap.git tap
          mkdir -p tap/Formula
          cat > tap/Formula/swarm.rb <<FORMULA
          class Swarm < Formula
            desc "Message bus and pane control for a tree of agent CLIs"
            homepage "https://github.com/PriyanshuUpadhyay/swarm"
            url "https://github.com/PriyanshuUpadhyay/swarm/releases/download/v$version/$tarball"
            sha256 "$sha"
            license "MIT"

            depends_on arch: :arm64
            depends_on macos: :tahoe
            depends_on "tmux"

            def install
              bin.install "bin/swarm"
              libexec.install Dir["libexec/*"]
            end

            test do
              assert_match "swarm #{version}", shell_output("#{bin}/swarm --version")
            end
          end
          FORMULA

          git -C tap rm -q --ignore-unmatch Casks/swarm-app.rb
          git -C tap add Formula/swarm.rb
          git -C tap -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "swarm $version"
          git -C tap push -q origin HEAD:main
