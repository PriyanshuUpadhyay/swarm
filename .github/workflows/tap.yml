name: Tap

# Points the Homebrew tap at a release once the owner publishes the draft, so the tarball and the
# DMG are public. The cask carries the CLI: its binary stanza links swarm on PATH to the copy inside
# Swarm.app, so one upgrade moves the app and the CLI together (ADR 0048).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tap:
    runs-on: ubuntu-latest
    steps:
      - name: Update the swarm-app cask and the pointer swarm formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          version="${RELEASE_TAG#v}"
          url="https://github.com/${{ github.repository }}/archive/refs/tags/$RELEASE_TAG.tar.gz"
          source_sha=$(curl -sSfL "$url" | sha256sum | cut -d' ' -f1)
          gh release download "$RELEASE_TAG" -R "${{ github.repository }}" -p "Swarm-$version.dmg"
          dmg_sha=$(sha256sum "Swarm-$version.dmg" | cut -d' ' -f1)

          install -m 600 /dev/null ~/tap_key
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/tap_key -o IdentitiesOnly=yes"
          git clone -q git@github.com:PriyanshuUpadhyay/homebrew-tap.git tap
          # This release only, then removed: the formula installs no bin/swarm, so its upgrade
          # (brew upgrades formulae before casks) frees the PATH link that the cask then takes.
          cat > tap/Formula/swarm.rb <<FORMULA
          class Swarm < Formula
            desc "Moved: the swarm-app cask installs the swarm CLI"
            homepage "https://github.com/PriyanshuUpadhyay/swarm"
            url "$url"
            sha256 "$source_sha"
            license "MIT"

            deprecate! date: "$(date -u +%Y-%m-%d)", because: "is installed by the swarm-app cask",
                       replacement_cask: "priyanshuupadhyay/tap/swarm-app"

            def install
              # A keg must hold one file.
              (pkgshare/"MOVED").write "swarm now ships inside Swarm.app; see the swarm-app cask.\n"
            end

            def caveats
              <<~EOS
                swarm now ships inside Swarm.app. Run:
                  brew uninstall priyanshuupadhyay/tap/swarm && brew install --cask priyanshuupadhyay/tap/swarm-app
              EOS
            end
          end
          FORMULA
          mkdir -p tap/Casks
          cat > tap/Casks/swarm-app.rb <<CASK
          cask "swarm-app" do
            version "$version"
            sha256 "$dmg_sha"

            url "https://github.com/PriyanshuUpadhyay/swarm/releases/download/v#{version}/Swarm-#{version}.dmg"
            name "Swarm"
            desc "Chat app for a tree of agent CLIs"
            homepage "https://github.com/PriyanshuUpadhyay/swarm"

            depends_on formula: "tmux"
            depends_on macos: :tahoe

            app "Swarm.app"
            binary "#{appdir}/Swarm.app/Contents/Helpers/swarm"

            caveats <<~EOS
              Swarm is not notarized by Apple, so macOS blocks its first launch. Allow it once:
                1. Open Swarm from Applications. When macOS says it cannot verify the app, click Done.
                2. Open System Settings > Privacy & Security and scroll to Security.
                3. Next to "Swarm was blocked", click Open Anyway and confirm with your password.
              If Open Anyway does not show, or macOS blocks the swarm command, run:
                xattr -dr com.apple.quarantine /Applications/Swarm.app
            EOS
          end
          CASK

          git -C tap add Formula/swarm.rb Casks/swarm-app.rb
          git -C tap -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "swarm $version"
          git -C tap push -q origin HEAD:main
